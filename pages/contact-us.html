<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us - Oshodi Online Shops</title>
  <style>
    :root {
      --primary: #4B2E83;
      --primary-hover: #392065;
      --primary-light: #f3effc;
      --bg: #f4f5f8;
      --card-bg: #ffffff;
      --text: #1a1a2e;
      --text-muted: #666e7a;
      --border: #e2e8f0;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.4;
    }

    a { text-decoration: none; color: inherit; }

    .topbar {
      background: #ffffff;
      height: 72px;
      display: flex;
      align-items: center;
      padding: 0 32px;
      border-bottom: 1px solid var(--border);
    }

    .brand-logo {
      height: 36px;
      display: block;
    }

    .back-link {
      margin-left: auto;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }

    .contact-wrap {
      max-width: 640px;
      margin: 60px auto;
      padding: 0 20px;
    }

    .contact-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      text-align: center;
    }

    .contact-card h1 {
      font-size: 1.6rem;
      margin-bottom: 10px;
    }

    .contact-card p.intro {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    .contact-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .contact-option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      text-align: left;
      transition: border-color 0.15s ease, background 0.15s ease;
    }

    .contact-option:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }

    .contact-option-icon {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .contact-option-icon.whatsapp {
      background: #e7f9ee;
      color: #25D366;
    }

    .contact-option-icon.email {
      background: var(--primary-light);
      color: var(--primary);
    }

    .contact-option-text .label {
      font-weight: 800;
      font-size: 0.95rem;
      margin-bottom: 2px;
    }

    .contact-option-text .detail {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    @media (max-width: 520px) {
      .contact-wrap { margin: 30px auto; }
      .contact-card { padding: 32px 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a href="../main/index.html">
      <img src="../assets/logo.png" alt="Oshodi Online Shops" class="brand-logo" />
    </a>
    <a href="../main/index.html" class="back-link">&larr; Back to shop</a>
  </header>

  <div class="contact-wrap">
    <div class="contact-card">
      <h1>Contact Us</h1>
      <p class="intro">Have a question or need help with an order? Reach out to us directly through WhatsApp or email.</p>

      <div class="contact-options">
        <a class="contact-option" href="https://wa.me/2349134333745" target="_blank" rel="noopener noreferrer">
          <span class="contact-option-icon whatsapp">&#128241;</span>
          <span class="contact-option-text">
            <div class="label">Chat on WhatsApp</div>
            <div class="detail">+234 913 433 3745</div>
          </span>
        </a>

        <a class="contact-option" href="mailto:victoredochie10@gmail.com">
          <span class="contact-option-icon email">&#9993;</span>
          <span class="contact-option-text">
            <div class="label">Send us an Email</div>
            <div class="detail">victoredochie10@gmail.com</div>
          </span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>

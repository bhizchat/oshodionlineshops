<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Shop Products - Oshodi Online Shops</title>

  <style>

    :root {

      --primary: #4B2E83;

      --primary-hover: #392065;

      --primary-light: #f3effc;

      --bg: #f4f5f8;

      --card-bg: #ffffff;

      --text: #1a1a2e;

      --text-muted: #666e7a;

      --border: #e2e8f0;

      --star: #F4801F;

      --radius: 12px;

    }



    * {

      box-sizing: border-box;

      margin: 0;

      padding: 0;

    }



    body {

      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

      background-color: var(--bg);

      color: var(--text);

      line-height: 1.4;

      overflow-x: hidden;

      max-width: 100%;

    }



    a { text-decoration: none; color: inherit; }



    /* Top Navigation Header */

    .topbar {

      background: #ffffff;

      height: 72px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding: 0 32px;

      border-bottom: 1px solid var(--border);

    }



    .brand {

      display: flex;

      align-items: center;

      text-decoration: none;

      cursor: pointer;

    }



    .brand-logo {

      height: 56px;

      width: auto;

      display: block;

    }



    .search-container {

      display: flex;

      align-items: center;

      width: 50%;

      max-width: 650px;

      background: #f1f3f7;

      border-radius: 10px;

      padding: 4px;

    }



    .location-select {

      background: transparent;

      border: none;

      padding: 10px 14px;

      font-size: 0.85rem;

      font-weight: 600;

      color: var(--text);

      display: flex;

      align-items: center;

      gap: 6px;

      border-right: 1px solid #dcdfe6;

      cursor: pointer;

    }



    .search-input {

      flex: 1;

      border: none;

      background: transparent;

      padding: 10px 16px;

      font-size: 0.9rem;

      outline: none;

    }



    .search-btn {

      background: var(--primary);

      border: none;

      color: white;

      width: 40px;

      height: 40px;

      border-radius: 8px;

      cursor: pointer;

      display: grid;

      place-items: center;

    }

    .search-btn svg {

      width: 18px;

      height: 18px;

      stroke: #ffffff;

      stroke-width: 2.5;

      fill: none;

    }



    .user-actions {

      display: flex;

      align-items: center;

      gap: 16px;

    }



    .lang-selector {

      font-size: 0.85rem;

      font-weight: 700;

      border: 1px solid var(--border);

      padding: 6px 12px;

      border-radius: 20px;

      display: flex;

      align-items: center;

      gap: 6px;

    }



    .nav-icon {

      position: relative;

      cursor: pointer;

      padding: 6px;

      color: #334155;

      display: flex;

      align-items: center;

      justify-content: center;

    }



    .sell-btn {

      background: var(--primary);

      color: white;

      border: none;

      padding: 10px 20px;

      border-radius: 8px;

      font-weight: 800;

      font-size: 0.8rem;

      letter-spacing: 0.03em;

      cursor: pointer;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      text-decoration: none;

    }



    /* Sub Navigation / Category Bar */

    .cat-bar {

      background: var(--primary);

      color: white;

      display: flex;

      align-items: center;

      padding: 0 32px;

      height: 46px;

      font-size: 0.85rem;

      font-weight: 600;

    }



    .cat-links {

      display: flex;

      align-items: center;

      gap: 16px;

    }



    .cat-link {

      padding: 6px 14px;

      border-radius: 16px;

      color: rgba(255, 255, 255, 0.85);

    }



    .cat-link.active {

      background: white;

      color: var(--primary);

      font-weight: 700;

    }

    .cat-link { display: flex; align-items: center; gap: 6px; }

    .cat-link .cat-icon { display: none; }

    .mobile-back-btn {
      display: none;
      background: none;
      border: none;
      font-size: 1.3rem;
      color: var(--primary);
      cursor: pointer;
      padding: 4px 8px 4px 0;
      line-height: 1;
      flex-shrink: 0;
    }



    /* Page Layout Grid */

    .container {

      max-width: 1440px;

      margin: 0 auto;

      padding: 24px 32px;

    }



    .breadcrumb {

      font-size: 0.85rem;

      color: var(--text-muted);

      margin-bottom: 16px;

    }



    .breadcrumb strong {

      color: var(--text);

    }



    .page-head h1 {

      font-size: 1.6rem;

      font-weight: 800;

      color: #111827;

      margin-bottom: 4px;

    }



    .page-head p {

      font-size: 0.9rem;

      color: var(--text-muted);

      margin-bottom: 20px;

    }



    .layout-grid {

      display: grid;

      grid-template-columns: 250px 1fr;

      gap: 24px;

      align-items: start;

    }



    /* Sidebar */

    .subcat-all-pill {

      display: flex;

      align-items: center;

      gap: 10px;

      background: var(--primary-light);

      border: 1px solid var(--primary);

      border-radius: var(--radius);

      padding: 14px;

      margin-bottom: 10px;

      cursor: pointer;

    }



    .subcat-all-pill.active {

      background: var(--primary);

      color: white;

    }



    .subcat-all-pill .subcat-icon {

      font-size: 1.2rem;

    }



    .subcat-all-pill .subcat-name {

      font-weight: 800;

      font-size: 0.9rem;

    }



    .subcat-all-pill .subcat-count {

      font-size: 0.75rem;

      opacity: 0.8;

    }



    .subcat-list {

      display: flex;

      flex-direction: column;

      background: var(--card-bg);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

    }



    .subcat-row {

      display: flex;

      align-items: center;

      gap: 10px;

      padding: 12px 14px;

      border-bottom: 1px solid var(--border);

      cursor: pointer;

      font-size: 0.85rem;

    }



    .subcat-row:last-child { border-bottom: none; }



    .subcat-row:hover { background: var(--primary-light); }



    .subcat-row.active {

      background: var(--primary-light);

      color: var(--primary);

      font-weight: 700;

    }



    .subcat-row .subcat-icon { font-size: 1rem; }



    .subcat-row .subcat-text { flex: 1; }



    .subcat-row .subcat-text .subcat-name { font-weight: 600; }



    .subcat-row .subcat-text .subcat-count {

      display: block;

      font-size: 0.72rem;

      color: var(--text-muted);

    }



    .subcat-row.active .subcat-text .subcat-count { color: var(--primary); }



    .subcat-row .chevron { color: var(--text-muted); }



    /* Main content */

    .subcat-icon-row {

      display: flex;

      gap: 14px;

      overflow-x: auto;

      padding-bottom: 12px;

      margin-bottom: 16px;

    }



    .subcat-icon-card {

      flex: 0 0 auto;

      width: 96px;

      background: var(--card-bg);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 14px 8px;

      text-align: center;

      cursor: pointer;

      font-size: 0.75rem;

      font-weight: 600;

    }



    .subcat-icon-card.active {

      border-color: var(--primary);

      background: var(--primary-light);

      color: var(--primary);

    }



    .subcat-icon-card .icon-emoji {

      font-size: 1.6rem;

      display: block;

      margin-bottom: 6px;

    }

    .subcat-more-btn { display: none; }

    .subcat-more-backdrop { display: none; }



    .filter-bar {

      display: flex;

      align-items: center;

      justify-content: space-between;

      flex-wrap: wrap;

      gap: 10px;

      margin-bottom: 14px;

    }



    .filter-left {

      display: flex;

      align-items: center;

      gap: 8px;

      flex-wrap: wrap;

    }



    .filter-chip {

      background: white;

      border: 1px solid var(--border);

      padding: 8px 14px;

      border-radius: 8px;

      font-size: 0.82rem;

      font-weight: 600;

      cursor: pointer;

      color: var(--text);

    }



    .filter-right {

      display: flex;

      align-items: center;

      gap: 10px;

    }

    .filter-dropdown-wrap {
      position: relative;
      display: inline-block;
    }

    .filter-chip.active-chip {
      border-color: var(--primary);
      color: var(--primary);
      background: var(--primary-light);
    }

    .filter-panel {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      z-index: 500;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      padding: 16px;
      width: 260px;
    }

    .filter-panel.open {
      display: block;
    }

    .filter-panel-title {
      font-weight: 700;
      font-size: 0.9rem;
      margin-bottom: 12px;
      color: var(--text);
    }

    .filter-panel-range {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
    }

    .filter-panel-range input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
    }

    .filter-panel-range span {
      color: var(--text-muted);
    }

    .filter-panel-options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 14px;
    }

    .filter-panel-options.scrollable {
      max-height: 260px;
      overflow-y: auto;
    }

    .filter-panel-option {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text);
      cursor: pointer;
    }

    .filter-panel-option input {
      accent-color: var(--primary);
    }

    .filter-panel-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-panel-clear {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }

    .filter-panel-save {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      text-transform: uppercase;
    }

    .filter-panel-save:hover {
      background: var(--primary-hover);
    }



    .view-toggle {

      display: flex;

      border: 1px solid var(--border);

      border-radius: 8px;

      overflow: hidden;

    }



    .view-toggle span {

      padding: 8px 10px;

      cursor: pointer;

      background: white;

    }



    .view-toggle span.active {

      background: var(--primary);

      color: white;

    }



    .results-text {

      font-size: 0.85rem;

      color: var(--text-muted);

      margin-bottom: 14px;

    }



    .product-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 14px;
    }

    .product-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: fit-content;
      text-decoration: none;
      transition: box-shadow 0.2s;
    }

    .product-card:hover {
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.06);
    }

    .product-img-wrap {
      position: relative;
      height: 140px;
      background: #e2e8f0;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .verified-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255, 255, 255, 0.95);
      color: var(--primary);
      font-size: 0.62rem;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 6px;
    }

    .fav-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.25);
      color: white;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-size: 0.8rem;
    }

    .product-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
    }

    .product-name {
      font-size: 0.82rem;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-spec {
      font-size: 0.7rem;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-price {
      font-size: 0.68rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-rating {
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      gap: 3px;
      margin-bottom: 8px;
      color: #334155;
    }

    .product-rating .stars { color: var(--star); }

    .view-details-btn {
      display: block;
      width: 100%;
      border: 1px solid #e2d9f8;
      background: #ffffff;
      color: var(--primary);
      padding: 7px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.75rem;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      transition: background 0.2s;
    }

    .view-details-btn:hover {
      background: var(--primary-light);
    }

    .empty-state {

      padding: 40px;

      text-align: center;

      color: var(--text-muted);

      grid-column: 1 / -1;

    }

    .page-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: #fff;
      transition: opacity 0.25s ease;
    }

    .page-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .page-loader .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #b9a4f0;
      animation: page-loader-bounce 1.4s ease-in-out infinite both;
    }

    .page-loader .dot:nth-child(1) { animation-delay: -0.32s; }
    .page-loader .dot:nth-child(2) { animation-delay: -0.16s; }
    .page-loader .dot:nth-child(3) { animation-delay: 0s; }

    @keyframes page-loader-bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }



    @media (max-width: 1100px) {

      .layout-grid { grid-template-columns: 1fr; }

      .product-grid { grid-template-columns: repeat(3, 1fr); }

    }



    @media (max-width: 768px) {

      .product-grid { grid-template-columns: repeat(2, 1fr); }

      .topbar { height: auto; padding: 10px 12px; gap: 8px; }
      .brand { display: none; }
      .mobile-back-btn { display: inline-flex; }
      .search-container { width: auto; flex: 1; margin: 0; }
      .user-actions { display: none; }

      .location-select { display: none; }
      .search-btn { display: none; }
      .search-input { padding: 12px 14px; font-size: 16px; }

      .cat-bar { display: none; }

      .breadcrumb { display: none; }
      .page-head p { display: none; }
      .page-head h1 { font-size: 1.15rem; margin-bottom: 10px; }

      /* Phase 1: subcategory picker (no subcategory chosen yet) */
      main { display: none; }
      .sidebar { width: 100%; }
      .subcat-all-pill {
        border-radius: 12px 12px 0 0;
        margin-bottom: 0;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-bottom: none;
      }
      .subcat-all-pill.active { background: var(--primary-light); color: var(--primary); }
      .subcat-list { border-radius: 0 0 12px 12px; }

      /* Phase 2: subcategory chosen -> show product browsing, hide picker list */
      body.subcat-chosen main { display: block; }
      body.subcat-chosen .sidebar { display: none; }

      /* Compact icon row: first 3 subcategories + "Other" tile */
      .subcat-icon-wrap {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
        margin-bottom: 14px;
      }
      .subcat-icon-row {
        display: contents;
      }
      .subcat-icon-card { width: auto; padding: 10px 4px; font-size: 0.66rem; overflow-x: visible; }
      .subcat-icon-card .icon-emoji { font-size: 1.3rem; margin-bottom: 4px; }
      .subcat-icon-card:nth-child(n+4) { display: none; }

      .subcat-more-btn {
        width: auto;
        background: var(--card-bg);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 10px 4px;
        text-align: center;
        cursor: pointer;
        font-size: 0.66rem;
        font-weight: 600;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .subcat-more-btn .icon-emoji { font-size: 1.3rem; margin-bottom: 4px; }

      /* "Other" reveals the full subcategory list as a bottom sheet */
      body.subcat-more-open {
        overflow: hidden;
      }
      body.subcat-more-open .subcat-more-backdrop {
        display: block;
      }
      body.subcat-chosen.subcat-more-open .sidebar {
        display: block;
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        max-height: 70vh;
        overflow-y: auto;
        background: #ffffff;
        z-index: 500;
        border-radius: 16px 16px 0 0;
        box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.18);
        padding: 14px;
        margin: 0;
      }

      .subcat-more-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.4);
        z-index: 400;
      }

      .filter-bar {
        flex-wrap: nowrap;
        overflow-x: visible;
        justify-content: flex-start;
        gap: 8px;
      }
      .filter-left { flex-wrap: nowrap; gap: 8px; width: 100%; }
      .filter-left > .filter-chip:first-child { display: none; }
      .filter-dropdown-wrap { flex: 1 1 0; min-width: 0; }
      .filter-dropdown-wrap .filter-chip {
        display: block;
        width: 100%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-align: center;
        padding: 8px 6px;
      }
      .filter-panel { width: 220px; }
      .filter-right { display: none; }

      .subcat-search-empty {
        display: none;
        padding: 16px;
        text-align: center;
        color: var(--text-muted);
        font-size: 0.85rem;
      }

    }

  </style>

</head>

<body>

  <div class="page-loader" id="page-loader">
    <span class="dot"></span>
    <span class="dot"></span>
    <span class="dot"></span>
  </div>



  <!-- Top Navigation Header -->

  <header class="topbar">

    <button type="button" class="mobile-back-btn" id="mobile-back-btn" aria-label="Go back">&#8592;</button>

    <a href="../main/index.html" class="brand">

      <img src="../assets/logo.png" alt="Oshodi Online Shops" class="brand-logo" />

    </a>



    <div class="search-container">

      <button class="location-select">📍 All Oshodi ▾</button>

      <input type="text" class="search-input" data-subcat-search placeholder="Search for products in Oshodi..." />

      <button class="search-btn" aria-label="search button">
        <svg viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="6"></circle>
          <path d="M16 16L21 21"></path>
        </svg>
      </button>

    </div>



    <div class="user-actions">

      <a href="contact-us.html" class="lang-selector">Contact us</a>

      <a href="fabrics.html" class="sell-btn">Check All Shops</a>

    </div>

  </header>



  <!-- Secondary Category Navigation Bar -->

  <nav class="cat-bar">

    <div class="cat-links" id="cat-links">

      <a href="../main/index.html" class="cat-link">
        <span class="cat-icon">☰</span>
        <span class="cat-label">All Categories</span>
      </a>

      <a href="category-products.html?cat=fabrics" class="cat-link" data-cat="fabrics">
        <span class="cat-icon">🧵</span>
        <span class="cat-label">Fabrics & Textiles</span>
      </a>

      <a href="category-products.html?cat=clothing" class="cat-link" data-cat="clothing">
        <span class="cat-icon">👗</span>
        <span class="cat-label">Clothing & Fashion</span>
      </a>

      <a href="category-products.html?cat=electronics" class="cat-link" data-cat="electronics">
        <span class="cat-icon">💻</span>
        <span class="cat-label">Electronics & Gadgets</span>
      </a>

      <a href="category-products.html?cat=foodstuffs" class="cat-link" data-cat="foodstuffs">
        <span class="cat-icon">🍲</span>
        <span class="cat-label">Foodstuffs & Oils</span>
      </a>

      <a href="category-products.html?cat=accessories" class="cat-link" data-cat="accessories">
        <span class="cat-icon">👜</span>
        <span class="cat-label">Accessories</span>
      </a>

    </div>

  </nav>



  <!-- Main Container -->

  <div class="container">

    <div class="breadcrumb">Home &gt; <span id="breadcrumb-cat"></span></div>



    <div class="page-head">

      <h1 id="page-title"></h1>

      <p id="page-subtitle"></p>

    </div>



    <div class="layout-grid">

      <!-- Sidebar -->

      <aside class="sidebar">

        <div class="subcat-all-pill active" id="subcat-all">

          <span class="subcat-icon" id="all-icon"></span>

          <div>

            <div class="subcat-name">All <span id="all-cat-label"></span></div>

            <div class="subcat-count" id="all-count"></div>

          </div>

        </div>

        <div class="subcat-list" id="subcat-list"></div>

        <div class="subcat-search-empty" id="subcat-search-empty">No matching subcategory found.</div>

      </aside>



      <!-- Main content -->

      <main>

        <div class="subcat-icon-wrap">
          <div class="subcat-icon-row" id="subcat-icon-row"></div>

          <button type="button" class="subcat-more-btn" id="subcat-more-btn">
            <span class="icon-emoji">⋯</span>
            <span>Other</span>
          </button>
        </div>



        <div class="filter-bar">

          <div class="filter-left">

            <span class="filter-chip">⏚ Filters</span>

            <div class="filter-dropdown-wrap">
              <span class="filter-chip" id="location-filter-chip">Location: All Oshodi ▾</span>
              <div class="filter-panel" id="location-filter-panel">
                <div class="filter-panel-title">Location</div>
                <div class="filter-panel-options scrollable" id="location-filter-options"></div>
              </div>
            </div>

            <div class="filter-dropdown-wrap">
              <span class="filter-chip" id="price-filter-chip">Price ▾</span>
              <div class="filter-panel" id="price-filter-panel">
                <div class="filter-panel-title">Price, ₦</div>
                <div class="filter-panel-range">
                  <input type="number" id="price-min-input" placeholder="min" min="0" />
                  <span>–</span>
                  <input type="number" id="price-max-input" placeholder="max" min="0" />
                </div>
                <div class="filter-panel-options" id="price-filter-options"></div>
                <div class="filter-panel-actions">
                  <button class="filter-panel-clear" id="price-filter-clear">Clear</button>
                  <button class="filter-panel-save" id="price-filter-save">Save</button>
                </div>
              </div>
            </div>

          </div>

          <div class="filter-right">

            <select class="filter-chip" id="sort-select">

              <option>Sort by: Most Recent</option>

              <option>Sort by: Price Low-High</option>

              <option>Sort by: Price High-Low</option>

              <option>Sort by: Top Rated</option>

            </select>

            <div class="view-toggle">

              <span class="active">⊞</span>

              <span>☰</span>

            </div>

          </div>

        </div>



        <div class="results-text" id="results-text"></div>



        <div class="product-grid" id="product-grid"></div>

      </main>

    </div>

    <div class="subcat-more-backdrop" id="subcat-more-backdrop"></div>

  </div>



  <script src="../shops/shops-data.js"></script>

  <script src="category-products-data.js"></script>

  <script src="../search-index.js"></script>

  <script src="../search.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="../supabase-config.js"></script>
  <script src="../sx-products.js"></script>
  <script src="../analytics.js"></script>

  <script>

    function hashString(str) {
      let hash = 0;
      for (let i = 0; i < str.length; i++) {
        hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      }
      return hash;
    }

    function formatPriceRange(priceStr, seedKey) {
      const num = parseInt(priceStr.replace(/[^0-9]/g, ''), 10);
      if (!num) return priceStr;
      const seed = hashString(seedKey || priceStr);
      const variance = 0.08 + (seed % 10) / 100;
      const low = Math.round((num * (1 - variance)) / 100) * 100;
      const high = Math.round((num * (1 + variance)) / 100) * 100;
      return `₦${low.toLocaleString()} - ${high.toLocaleString()}`;
    }

    (async function () {

    const params = new URLSearchParams(window.location.search);
    const CAT_KEY_PATTERN = /^[a-z0-9_-]+$/i;
    const rawCat = params.get('cat');
    const cat = (rawCat && CAT_KEY_PATTERN.test(rawCat) && categoryPageMeta[rawCat]) ? rawCat : 'electronics';

    const meta = categoryPageMeta[cat] || categoryPageMeta.electronics;

    // Maps this page's category keys to the category values used by the
    // Strategic X onboarding form / sx_products_public.category column.
    const META_KEY_TO_SX_CATEGORY = {
      fabrics: 'fabrics',
      clothing: 'fashion',
      electronics: 'electronics',
      foodstuffs: 'foodstuff',
      accessories: 'accessories'
    };



    document.title = `${meta.title} - Oshodi Online Shops`;

    document.getElementById('breadcrumb-cat').textContent = meta.title;

    document.getElementById('page-title').textContent = meta.title;

    document.getElementById('page-subtitle').textContent = meta.subtitle;

    document.getElementById('all-icon').textContent = meta.icon;

    document.getElementById('all-cat-label').textContent = meta.title.split(' and ')[0];



    document.querySelectorAll('.cat-link[data-cat]').forEach((link) => {

      link.classList.toggle('active', link.dataset.cat === cat);

    });



    // Build product list: for fabrics/electronics, flatten real shop data; otherwise use static fallback.

    let products = [];

    if (cat === 'fabrics' || cat === 'electronics') {

      Object.keys(shops).forEach((shopKey) => {

        const shop = shops[shopKey];

        if (shop.category !== cat) return;

        shop.products.forEach((product, productIndex) => {

          const nameLower = product.name.toLowerCase();

          let tag = 'other';

          for (const sub of meta.subcategories) {

            if (sub.match.some((kw) => nameLower.includes(kw))) {

              tag = sub.key;

              break;

            }

          }

          products.push({

            name: product.name,

            price: product.price,

            score: product.score,

            count: product.count,

            image: product.image,

            shop: shop.name,

            location: shop.location,

            tag,

            shopKey,

            productIndex

          });

        });

      });

    } else {

      products = (meta.products || []).map((p, index) => ({
        ...p,
        shopKey: `${cat}-demo`,
        productIndex: index,
        location: p.location || 'Oshodi Main Market, Oshodi-Isolo, Lagos'
      }));

    }

    // Merge in real Strategic X vendor products (sx_products_public) for this
    // category, restricted to the Oshodi Market Online platform. Queried fresh
    // on every page load/refresh (no client-side caching of the results), so
    // newly published/edited vendor listings always show up immediately.
    const sxCategory = META_KEY_TO_SX_CATEGORY[cat];
    let sxReviewStats = {};
    if (sxCategory) {
      try {
        const sxResult = await supabaseClient
          .from('sx_products_public')
          .select('*')
          .eq('market_platform', 'oshodi-market-online')
          .eq('category', sxCategory)
          .order('created_at', { ascending: false });
        if (!sxResult.error && sxResult.data) {
          sxResult.data.forEach((row) => {
            // Vendors pick `subcategory` from a dropdown scoped to their
            // chosen category, so its value always exactly matches one of
            // this category's `meta.subcategories[].label` strings (except
            // for the `other` top-level category, which has no subcategory
            // list and always sends `subcategory: null`). Falls back to
            // 'other' (shown only under "All <Category>", not any specific
            // subcategory tile) if it's missing or doesn't match anything.
            const matchedSub = row.subcategory
              ? meta.subcategories.find((sub) => sub.label === row.subcategory)
              : null;
            products.push({
              name: row.product_name,
              price: row.selling_price,
              image: sxProductThumb(row.images),
              shop: row.shop_name || 'Strategic X Vendor',
              location: '',
              tag: matchedSub ? matchedSub.key : 'other',
              sxId: row.id
            });
          });


          // Real review stats (never fabricated) so a product's card can
          // switch from "New listing" to an actual star rating + review
          // count the moment a genuine review is submitted for it.
          sxReviewStats = await fetchSxReviewStats(supabaseClient, sxResult.data.map((row) => row.id));
        }
      } catch (err) {
        console.warn('Could not load Strategic X products:', err);
      }
    }



    // Render sidebar subcategory counts

    const subcatList = document.getElementById('subcat-list');

    subcatList.innerHTML = meta.subcategories.map((sub) => {

      const count = products.filter((p) => p.tag === sub.key).length;

      return `

        <div class="subcat-row" data-tag="${sub.key}">

          <span class="subcat-icon">${sub.icon}</span>

          <div class="subcat-text">

            <span class="subcat-name">${sub.label}</span>

            <span class="subcat-count">${count} products</span>

          </div>

          <span class="chevron">›</span>

        </div>

      `;

    }).join('');



    document.getElementById('all-count').textContent = `${products.length} products`;



    // Render icon row (mirrors sidebar)

    const iconRow = document.getElementById('subcat-icon-row');

    iconRow.innerHTML = meta.subcategories.map((sub) => `

      <div class="subcat-icon-card" data-tag="${sub.key}">

        <span class="icon-emoji">${sub.icon}</span>

        <span>${sub.label}</span>

      </div>

    `).join('');

    const subcatMoreBtnEl = document.getElementById('subcat-more-btn');
    if (subcatMoreBtnEl && meta.subcategories.length <= 3) {
      subcatMoreBtnEl.style.display = 'none';
    }



    function productLink(p) {

      if (p.sxId) {

        return `../shops/sx-product.html?id=${p.sxId}`;

      }

      if (p.shopKey !== undefined) {

        return `../shops/product.html?shop=${p.shopKey}&product=${p.productIndex}`;

      }

      const meta2 = categoryMeta ? categoryMeta[cat] : null;

      return meta2 ? meta2.href : '#';

    }



    function getPriceValue(p) {
      return parseInt(String(p.price).replace(/[^0-9]/g, ''), 10) || 0;
    }

    const oshodiStreets = [
      'Adejumobi Street', 'Adekunle Street', 'Adeoye Street', 'Adewale Crescent', 'Adeyemi Street',
      'Akinpelu Street', 'Alimi Oke Street', 'Apapa-Oworonshoki Expressway', 'Araromi Street',
      'Banjoko Street', 'Boladale Street', 'Boye Street', 'Brown Street', 'BRT Lane',
      'Church Street',
      'Enialonbinu Street', 'Ewenla Road',
      'Ganikale Close',
      'Igbehinadun Street', 'Inasa Street', 'Ishola Anigbjumo Street',
      'Kunle Akinosi Street',
      'Mabayoje Street', 'MacCarthy Lane', 'Mosaku Street',
      'Okun Owa Street', 'Oredeyin Street', 'Orona Street', 'Oshodi Road', 'Owoseni Street', 'Oyetayo Street',
      'Sabiolegbe Street', 'Seinde Callisto Street', 'Sodehinde Close', 'Soneye Street'
    ];

    let priceFilter = null;
    let locationFilter = null;

    function sxRatingHtml(sxId) {
      const stats = sxReviewStats[String(sxId).toLowerCase()];
      if (stats && stats.count > 0) {
        const rounded = Math.round(stats.avg);
        const stars = '★'.repeat(rounded) + '☆'.repeat(5 - rounded);
        return `<span class="stars">${stars}</span> ${stats.avg.toFixed(1)} (${stats.count})`;
      }
      return 'New listing';
    }

    function renderGrid(filterTag) {

      let filtered = filterTag ? products.filter((p) => p.tag === filterTag) : products;

      if (locationFilter) {
        filtered = filtered.filter((p) => (p.location || '').toLowerCase().includes(locationFilter.toLowerCase()));
      }

      if (priceFilter) {
        filtered = filtered.filter((p) => {
          const val = getPriceValue(p);
          if (priceFilter.min != null && val < priceFilter.min) return false;
          if (priceFilter.max != null && val > priceFilter.max) return false;
          return true;
        });
      }

      const grid = document.getElementById('product-grid');

      document.getElementById('results-text').textContent = `${filtered.length} products found`;



      if (filtered.length === 0) {

        grid.innerHTML = `<div class="empty-state">No products found in this subcategory yet.</div>`;

        return;

      }



      grid.innerHTML = filtered.map((p) => `

        <a href="${productLink(p)}" class="product-card">

          <div class="product-img-wrap">

            <img src="${escapeHtml(p.image)}" alt="${escapeHtml(p.name)}" />

            <span class="verified-badge">✔ Verified</span>

            <span class="fav-badge">♡</span>

          </div>

          <div class="product-body">

            <div class="product-name">${escapeHtml(p.name)}</div>

            <div class="product-spec">${escapeHtml(p.shop)}</div>

            <div class="product-price">${p.sxId ? formatNaira(p.price) : formatPriceRange(p.price, p.name)}</div>

            ${p.sxId ? `<div class="product-rating">${sxRatingHtml(p.sxId)}</div>` : `<div class="product-rating"><span class="stars">★★★★★</span> ${p.score} (${p.count})</div>`}

            <span class="view-details-btn">View Details</span>

          </div>

        </a>

      `).join('');

    }



    let activeTag = null;

    function isMobileView() {
      return window.matchMedia('(max-width: 768px)').matches;
    }

    function closeMorePanel() {
      document.body.classList.remove('subcat-more-open');
    }

    function setActive(tag) {

      activeTag = tag;

      document.getElementById('subcat-all').classList.toggle('active', !tag);

      document.querySelectorAll('.subcat-row').forEach((row) => {

        row.classList.toggle('active', row.dataset.tag === tag);

      });

      document.querySelectorAll('.subcat-icon-card').forEach((card) => {

        card.classList.toggle('active', card.dataset.tag === tag);

      });

      renderGrid(tag);

      document.body.classList.add('subcat-chosen');

      closeMorePanel();

      if (isMobileView()) window.scrollTo(0, 0);

      applyMobilePlaceholder();

    }

    document.getElementById('subcat-all').addEventListener('click', () => setActive(null));

    subcatList.addEventListener('click', (e) => {

      const row = e.target.closest('.subcat-row');

      if (row) setActive(row.dataset.tag);

    });

    iconRow.addEventListener('click', (e) => {

      const card = e.target.closest('.subcat-icon-card');

      if (card) setActive(card.dataset.tag);

    });

    const subcatMoreBtn = document.getElementById('subcat-more-btn');
    if (subcatMoreBtn) {
      subcatMoreBtn.addEventListener('click', () => {
        document.body.classList.toggle('subcat-more-open');
      });
    }

    const subcatMoreBackdrop = document.getElementById('subcat-more-backdrop');
    if (subcatMoreBackdrop) {
      subcatMoreBackdrop.addEventListener('click', closeMorePanel);
    }

    // Mobile back button: while browsing a subcategory's products, it returns
    // to the subcategory picker list; otherwise it behaves like a normal
    // browser back button.
    const mobileBackBtn = document.getElementById('mobile-back-btn');
    if (mobileBackBtn) {
      mobileBackBtn.addEventListener('click', () => {
        if (isMobileView() && document.body.classList.contains('subcat-chosen')) {
          document.body.classList.remove('subcat-chosen');
          closeMorePanel();
          window.scrollTo(0, 0);
          applyMobilePlaceholder();
        } else {
          history.back();
        }
      });
    }

    // Mobile-only subcategory search: the header search bar is simplified to
    // a plain input (no location pill, no search button). While no
    // subcategory is chosen yet (picker list), pressing Enter filters that
    // list. Once a subcategory is chosen, the input behaves like a normal
    // product search bar again (handled by search.js, guarded by the
    // `subcat-chosen` body class).
    const subcatSearchInput = document.querySelector('.search-input[data-subcat-search]');
    const subcatSearchEmpty = document.getElementById('subcat-search-empty');

    function applyMobilePlaceholder() {
      if (!subcatSearchInput) return;
      var pickerMode = isMobileView() && !document.body.classList.contains('subcat-chosen');
      subcatSearchInput.placeholder = pickerMode
        ? 'Find subcategory...'
        : 'Search for products in Oshodi...';
    }

    function filterSubcatList(query) {
      const rows = document.querySelectorAll('#subcat-list .subcat-row');
      let anyVisible = false;
      rows.forEach((row) => {
        const nameEl = row.querySelector('.subcat-name');
        const name = nameEl ? nameEl.textContent.toLowerCase() : '';
        const match = !query || name.includes(query);
        row.style.display = match ? '' : 'none';
        if (match) anyVisible = true;
      });
      const allPill = document.getElementById('subcat-all');
      if (allPill) allPill.style.display = query ? 'none' : '';
      if (subcatSearchEmpty) {
        subcatSearchEmpty.style.display = (!anyVisible && query) ? 'block' : 'none';
      }
    }

    if (subcatSearchInput) {
      applyMobilePlaceholder();
      window.addEventListener('resize', applyMobilePlaceholder);

      subcatSearchInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || !isMobileView()) return;
        if (document.body.classList.contains('subcat-chosen')) return;
        e.preventDefault();
        filterSubcatList(subcatSearchInput.value.trim().toLowerCase());
      });
    }

    const initialSub = params.get('sub');
    if (initialSub && meta.subcategories.some((s) => s.key === initialSub)) {
      // Enters "browse mode" directly (adds body.subcat-chosen), skipping
      // the mobile subcategory picker since a subcategory was pre-selected.
      setActive(initialSub);
    } else {
      // No subcategory pre-selected: render all products for desktop, and
      // on mobile the picker list stays visible until setActive() runs.
      renderGrid(null);
    }

    // Price filter panel
    const priceChip = document.getElementById('price-filter-chip');
    const pricePanel = document.getElementById('price-filter-panel');
    const priceMinInput = document.getElementById('price-min-input');
    const priceMaxInput = document.getElementById('price-max-input');
    const priceOptionsWrap = document.getElementById('price-filter-options');
    const priceClearBtn = document.getElementById('price-filter-clear');
    const priceSaveBtn = document.getElementById('price-filter-save');

    // Location filter panel
    const locationChip = document.getElementById('location-filter-chip');
    const locationPanel = document.getElementById('location-filter-panel');
    const locationOptionsWrap = document.getElementById('location-filter-options');

    locationOptionsWrap.innerHTML = ['All Oshodi', ...oshodiStreets].map((street) => {
      const value = street === 'All Oshodi' ? '' : street;
      return `<div class="filter-panel-item${value === '' ? ' active' : ''}" data-street="${value}">${street}</div>`;
    }).join('');

    function closeLocationPanel() {
      locationPanel.classList.remove('open');
    }

    function updateLocationChipLabel(street) {
      if (isMobileView()) {
        locationChip.textContent = street ? `Region: ${street} ▾` : 'Region ▾';
      } else {
        locationChip.textContent = street ? `Location: ${street} ▾` : 'Location: All Oshodi ▾';
      }
    }

    updateLocationChipLabel(null);
    window.addEventListener('resize', () => updateLocationChipLabel(locationFilter));

    locationChip.addEventListener('click', (e) => {
      e.stopPropagation();
      closePricePanel();
      locationPanel.classList.toggle('open');
    });

    locationPanel.addEventListener('click', (e) => e.stopPropagation());

    locationOptionsWrap.addEventListener('click', (e) => {
      const item = e.target.closest('.filter-panel-item');
      if (!item) return;
      const street = item.dataset.street;
      locationFilter = street || null;
      updateLocationChipLabel(street);
      locationChip.classList.toggle('active-chip', !!street);
      locationOptionsWrap.querySelectorAll('.filter-panel-item').forEach((el) => {
        el.classList.toggle('active', el.dataset.street === street);
      });
      renderGrid(activeTag);
      closeLocationPanel();
    });

    const priceValues = products.map(getPriceValue).filter((v) => v > 0).sort((a, b) => a - b);
    const priceBands = [];
    if (priceValues.length) {
      const lo = priceValues[0];
      const hi = priceValues[priceValues.length - 1];
      const step = Math.max(Math.round((hi - lo) / 4 / 100) * 100, 100);
      let bandStart = Math.floor(lo / 100) * 100;
      for (let i = 0; i < 4; i++) {
        const bandEnd = i === 3 ? null : bandStart + step;
        priceBands.push({ min: bandStart, max: bandEnd });
        bandStart = bandEnd;
      }
    }

    priceOptionsWrap.innerHTML = priceBands.map((band, i) => {
      const label = band.max == null
        ? `More than ${band.min.toLocaleString()}`
        : `${band.min.toLocaleString()} - ${band.max.toLocaleString()}`;
      return `
        <label class="filter-panel-option">
          <input type="radio" name="price-band" data-min="${band.min}" data-max="${band.max == null ? '' : band.max}" />
          <span>${label}</span>
        </label>
      `;
    }).join('');

    function closePricePanel() {
      pricePanel.classList.remove('open');
    }

    priceChip.addEventListener('click', (e) => {
      e.stopPropagation();
      closeLocationPanel();
      pricePanel.classList.toggle('open');
    });

    pricePanel.addEventListener('click', (e) => e.stopPropagation());

    document.addEventListener('click', () => { closePricePanel(); closeLocationPanel(); });

    priceOptionsWrap.addEventListener('change', (e) => {
      const target = e.target.closest('input[type="radio"]');
      if (!target) return;
      priceMinInput.value = target.dataset.min || '';
      priceMaxInput.value = target.dataset.max || '';
    });

    priceClearBtn.addEventListener('click', () => {
      priceMinInput.value = '';
      priceMaxInput.value = '';
      priceOptionsWrap.querySelectorAll('input[type="radio"]').forEach((r) => { r.checked = false; });
      priceFilter = null;
      priceChip.classList.remove('active-chip');
      renderGrid(activeTag);
      closePricePanel();
    });

    priceSaveBtn.addEventListener('click', () => {
      const min = priceMinInput.value ? parseInt(priceMinInput.value, 10) : null;
      const max = priceMaxInput.value ? parseInt(priceMaxInput.value, 10) : null;
      priceFilter = (min != null || max != null) ? { min, max } : null;
      priceChip.classList.toggle('active-chip', !!priceFilter);
      renderGrid(activeTag);
      closePricePanel();
    });

    const pageLoader = document.getElementById('page-loader');
    if (pageLoader) pageLoader.classList.add('hidden');

    })();

  </script>
